name: Publish to GitHub Packages

on:
  # Runs once per release: pushing a tag, or creating a release on GitHub (which pushes the tag), triggers it
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 2.0.0-alpha.8). Empty = tag name or build.gradle version'
        required: false
        type: string

# Version to publish: the pushed tag (v1.2.3 -> 1.2.3), or the manual input; empty = build.gradle default
env:
  RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}

jobs:
  publish-to-github-packages:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build project
        run: ./gradlew build

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: ./gradlew publishMavenJavaPublicationToGitHubPackagesRepository --stacktrace

      - name: Cleanup
        if: always()
        run: ./gradlew --stop